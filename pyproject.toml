[project]
name = "url-shortener"
version = "0.1.0"
description = "A practice URL shortener with JWT auth and async DB pooling. Rate limiting and ELK logging are planned."
readme = "README.md"
requires-python = ">=3.13.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
    "watchfiles>=1.2.0",
]
